<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WhatsApp Bot Manager</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=Quicksand:wght@300&display=swap");
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Quicksand", sans-serif;
}
body {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  background: #111;
  width: 100%;
  overflow: hidden;
}
.ring {
  position: relative;
  width: 500px;
  height: 500px;
  display: flex;
  justify-content: center;
  align-items: center;
}
.ring i {
  position: absolute;
  inset: 0;
  border: 2px solid #fff;
  transition: 0.5s;
}
.ring i:nth-child(1) {
  border-radius: 38% 62% 63% 37% / 41% 44% 56% 59%;
  animation: animate 6s linear infinite;
}
.ring i:nth-child(2) {
  border-radius: 41% 44% 56% 59%/38% 62% 63% 37%;
  animation: animate 4s linear infinite;
}
.ring i:nth-child(3) {
  border-radius: 41% 44% 56% 59%/38% 62% 63% 37%;
  animation: animate2 10s linear infinite;
}
.ring:hover i {
  border: 6px solid var(--clr);
  filter: drop-shadow(0 0 20px var(--clr));
}
@keyframes animate {
  0% {
    transform: rotate(0deg);
  }
  100% {
    transform: rotate(360deg);
  }
}
@keyframes animate2 {
  0% {
    transform: rotate(360deg);
  }
  100% {
    transform: rotate(0deg);
  }
}
.login {
  position: absolute;
  width: 300px;
  height: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  gap: 20px;
}
.login h2 {
  font-size: 2em;
  color: #fff;
}
.login .inputBx {
  position: relative;
  width: 100%;
}
.login .inputBx input {
  position: relative;
  width: 100%;
  padding: 12px 20px;
  background: transparent;
  border: 2px solid #fff;
  border-radius: 40px;
  font-size: 1.2em;
  color: #fff;
  box-shadow: none;
  outline: none;
  cursor: pointer;
  transition: all 0.3s ease;
}
.login .inputBx input[type="submit"] {
  width: 100%;
  border: none;
  cursor: pointer;
  font-weight: bold;
}
.login .inputBx input::placeholder {
  color: rgba(255, 255, 255, 0.75);
}
.login .links {
  position: relative;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
}
.login .links a {
  color: #fff;
  text-decoration: none;
}

/* Status indicator */
.status-indicator {
  position: absolute;
  top: 20px;
  right: 20px;
  padding: 10px 20px;
  border-radius: 20px;
  font-weight: bold;
  font-size: 0.9em;
}

.status-connected {
  background: #00ff88;
  color: #000;
}

.status-disconnected {
  background: #ff4444;
  color: #fff;
}

/* Button states */
.btn-stop {
  background: #007bff;
  background: linear-gradient(45deg, #002fff, #00d0ff);
}

.btn-start {
  background: #ff4444;
  background: linear-gradient(45deg, #cc0000, #ff6666);
}

.btn-start:hover {
  background: linear-gradient(45deg, #aa0000, #ff4444);
}

.btn-stop:hover {
  background: linear-gradient(45deg, #001aff, #00aaff);
}

</style>
</head>
<body>
  <div class="status-indicator" id="statusIndicator">
    Status: Unknown
  </div>
  
  <div class="ring">
    <i style="--clr:#00eeff;"></i>
    <i style="--clr:#0048ff;"></i>
    <i style="--clr:#ffffff;"></i>
    <div class="login">
      <h2>Manage Bot</h2>
      <div class="inputBx">
        <input type="submit" id="resetButton" value="Restart">
      </div>
      <div class="inputBx">
        <input type="submit" id="toggleButton" class="btn-stop" value="Stop">
      </div>
      <div class="inputBx">
        <input type="submit" id="updateButton" value="Update">
      </div>
      <div class="links">
        <a href="https://github.com/Alien-alfa">Github</a>
        <a href="https://www.instagram.com/alienalfa/">Instagram</a>
      </div>
    </div>
  </div>

<script>
let isConnected = true;

// Check connection status on page load
async function checkStatus() {
  try {
    const response = await fetch('/health');
    const data = await response.json();
    updateStatus(data.botStatus || 'unknown');
  } catch (error) {
    updateStatus('disconnected');
  }
}

function updateStatus(status) {
  const statusIndicator = document.getElementById('statusIndicator');
  const toggleButton = document.getElementById('toggleButton');
  
  if (status === 'connected' || status === 'running') {
    isConnected = true;
    statusIndicator.textContent = 'Status: Connected';
    statusIndicator.className = 'status-indicator status-connected';
    toggleButton.value = 'Stop';
    toggleButton.className = 'btn-stop';
  } else {
    isConnected = false;
    statusIndicator.textContent = 'Status: Disconnected';
    statusIndicator.className = 'status-indicator status-disconnected';
    toggleButton.value = 'Start';
    toggleButton.className = 'btn-start';
  }
}

// Restart button
document.getElementById('resetButton').addEventListener('click', async function() {
  console.log("[Restarting]");
  try {
    await fetch('/restart', { method: 'POST' });
    setTimeout(checkStatus, 2000);
  } catch (error) {
    console.error('Restart failed:', error);
  }
});

// Toggle Stop/Start button
document.getElementById('toggleButton').addEventListener('click', async function() {
  const endpoint = isConnected ? '/stop-whatsapp' : '/start-whatsapp';
  const action = isConnected ? 'Stopping' : 'Starting';
  
  console.log(`[${action} WhatsApp]`);
  
  try {
    const response = await fetch(endpoint, { method: 'POST' });
    const data = await response.json();
    
    if (response.ok) {
      // Update UI immediately
      updateStatus(isConnected ? 'disconnected' : 'connected');
      console.log(data.message);
    } else {
      console.error('Action failed:', data.error);
    }
  } catch (error) {
    console.error(`${action} failed:`, error);
  }
});

// Update button
document.getElementById('updateButton').addEventListener('click', async function() {
  console.log("[Updating]");
  try {
    await fetch('/update', { method: 'POST' });
  } catch (error) {
    console.error('Update failed:', error);
  }
});

// Check status every 10 seconds
setInterval(checkStatus, 10000);

// Initial status check
checkStatus();

</script>

</body>
</html>
