<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WhatsApp Bot Manager</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600&display=swap");
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Quicksand", sans-serif;
}
body {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  background: linear-gradient(135deg, #1e1e2e 0%, #2d2d44 100%);
  width: 100%;
  padding: 20px;
}

.container {
  background: rgba(255, 255, 255, 0.1);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255, 255, 255, 0.2);
  border-radius: 20px;
  padding: 40px;
  box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
  width: 100%;
  max-width: 400px;
  text-align: center;
}

.manager-title {
  font-size: 2.5em;
  color: #fff;
  margin-bottom: 30px;
  font-weight: 600;
  text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
}

.button-group {
  display: flex;
  flex-direction: column;
  gap: 15px;
  margin-bottom: 30px;
}

.btn {
  padding: 15px 25px;
  border: none;
  border-radius: 12px;
  font-size: 1.1em;
  font-weight: 500;
  color: #fff;
  cursor: pointer;
  transition: all 0.3s ease;
  text-transform: uppercase;
  letter-spacing: 1px;
  box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
  position: relative;
  overflow: hidden;
}

.btn::before {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
  transition: left 0.5s;
}

.btn:hover::before {
  left: 100%;
}

.btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
}

.btn:active {
  transform: translateY(0);
}

.btn-restart {
  background: linear-gradient(135deg, #4f46e5, #7c3aed);
}

.btn-restart:hover {
  background: linear-gradient(135deg, #4338ca, #6d28d9);
}

.btn-stop {
  background: linear-gradient(135deg, #ef4444, #dc2626);
}

.btn-stop:hover {
  background: linear-gradient(135deg, #dc2626, #b91c1c);
}

.btn-start {
  background: linear-gradient(135deg, #10b981, #059669);
}

.btn-start:hover {
  background: linear-gradient(135deg, #059669, #047857);
}

.btn-update {
  background: linear-gradient(135deg, #f59e0b, #d97706);
}

.btn-update:hover {
  background: linear-gradient(135deg, #d97706, #b45309);
}

/* Status indicator */
.status-indicator {
  position: absolute;
  top: 20px;
  right: 20px;
  padding: 12px 20px;
  border-radius: 25px;
  font-weight: 600;
  font-size: 0.9em;
  box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
  transition: all 0.3s ease;
}

.status-connected {
  background: linear-gradient(135deg, #10b981, #059669);
  color: #fff;
}

.status-disconnected {
  background: linear-gradient(135deg, #ef4444, #dc2626);
  color: #fff;
}

.links {
  display: flex;
  justify-content: space-around;
  gap: 20px;
  margin-top: 20px;
}

.links a {
  color: rgba(255, 255, 255, 0.8);
  text-decoration: none;
  font-weight: 500;
  transition: all 0.3s ease;
  padding: 8px 16px;
  border-radius: 8px;
  background: rgba(255, 255, 255, 0.1);
}

.links a:hover {
  color: #fff;
  background: rgba(255, 255, 255, 0.2);
  transform: translateY(-1px);
}

@media (max-width: 480px) {
  .container {
    padding: 30px 20px;
  }
  
  .manager-title {
    font-size: 2em;
  }
  
  .btn {
    padding: 12px 20px;
    font-size: 1em;
  }
}

</style>
</head>
<body>
  <div class="status-indicator" id="statusIndicator">
    Status: Unknown
  </div>
  
  <div class="container">
    <h2 class="manager-title">Bot Manager</h2>
    
    <div class="button-group">
      <button class="btn btn-restart" id="resetButton">
        🔄 Restart Bot
      </button>
      
      <button class="btn btn-stop" id="toggleButton">
        ⏹️ Stop WhatsApp
      </button>
      
      <button class="btn btn-update" id="updateButton">
        📦 Update Bot
      </button>
    </div>
    
    <div class="links">
      <a href="https://github.com/Alien-alfa" target="_blank">
        📁 GitHub
      </a>
      <a href="https://www.instagram.com/alienalfa/" target="_blank">
        📸 Instagram
      </a>
    </div>
  </div>

<script>
let isConnected = true;

// Check connection status on page load
async function checkStatus() {
  try {
    const response = await fetch('/health');
    const data = await response.json();
    updateStatus(data.botStatus || 'unknown');
  } catch (error) {
    updateStatus('disconnected');
  }
}

function updateStatus(status) {
  const statusIndicator = document.getElementById('statusIndicator');
  const toggleButton = document.getElementById('toggleButton');
  
  if (status === 'connected' || status === 'running') {
    isConnected = true;
    statusIndicator.textContent = 'Status: Connected & Active';
    statusIndicator.className = 'status-indicator status-connected';
    toggleButton.innerHTML = '⏹️ Stop WhatsApp';
    toggleButton.className = 'btn btn-stop';
  } else if (status === 'stopped') {
    isConnected = false;
    statusIndicator.textContent = 'Status: Stopped';
    statusIndicator.className = 'status-indicator status-disconnected';
    toggleButton.innerHTML = '▶️ Start WhatsApp';
    toggleButton.className = 'btn btn-start';
  } else {
    isConnected = false;
    statusIndicator.textContent = 'Status: Disconnected';
    statusIndicator.className = 'status-indicator status-disconnected';
    toggleButton.innerHTML = '▶️ Start WhatsApp';
    toggleButton.className = 'btn btn-start';
  }
}

// Show loading state for buttons
function showLoading(button, originalText) {
  button.disabled = true;
  button.style.opacity = '0.7';
  button.innerHTML = '⏳ Processing...';
  
  setTimeout(() => {
    button.disabled = false;
    button.style.opacity = '1';
    button.innerHTML = originalText;
  }, 2000);
}

// Restart button
document.getElementById('resetButton').addEventListener('click', async function() {
  const originalText = this.innerHTML;
  showLoading(this, originalText);
  
  console.log("[Restarting Bot]");
  try {
    await fetch('/restart', { method: 'POST' });
    setTimeout(checkStatus, 3000);
  } catch (error) {
    console.error('Restart failed:', error);
  }
});

// Toggle Stop/Start button
document.getElementById('toggleButton').addEventListener('click', async function() {
  const endpoint = isConnected ? '/stop-whatsapp' : '/start-whatsapp';
  const action = isConnected ? 'Stopping' : 'Starting';
  const originalText = this.innerHTML;
  
  showLoading(this, originalText);
  
  console.log(`[${action} WhatsApp]`);
  
  try {
    const response = await fetch(endpoint, { method: 'POST' });
    const data = await response.json();
    
    if (response.ok) {
      // Update UI immediately
      updateStatus(isConnected ? 'disconnected' : 'connected');
      console.log(data.message);
    } else {
      console.error('Action failed:', data.error);
    }
  } catch (error) {
    console.error(`${action} failed:`, error);
  }
});

// Update button
document.getElementById('updateButton').addEventListener('click', async function() {
  const originalText = this.innerHTML;
  showLoading(this, originalText);
  
  console.log("[Updating Bot]");
  try {
    await fetch('/update', { method: 'POST' });
  } catch (error) {
    console.error('Update failed:', error);
  }
});

// Check status every 10 seconds
setInterval(checkStatus, 10000);

// Initial status check
checkStatus();

</script>

</body>
</html>
